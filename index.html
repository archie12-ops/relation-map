<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RELATION.MAP</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f14;--bg2:#141720;--bg3:#1a1e28;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.15);
  --t1:#e8eaf0;--t2:#8b909e;--t3:#5a5f6e;
  --acc:#7c6af7;--acc2:#5b4ed4;--acc-glow:rgba(124,106,247,.22);
  --green:#4ade80;--teal:#2dd4bf;--amber:#fbbf24;
  --c-me:#7F77DD;--c-person:#1D9E75;--c-info:#BA7517;
}
html,body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--t1);height:100vh;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}

/* topbar */
.topbar{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;z-index:10}
.logo{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:500;color:var(--acc);letter-spacing:.05em}
.logo span{color:var(--t2)}
.chips{display:flex;gap:6px;margin-left:auto}
.chip{display:flex;align-items:center;gap:4px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--t2)}
.cdot{width:5px;height:5px;border-radius:50%}

/* layout */
.main{display:flex;flex:1;overflow:hidden}

/* left */
.left{width:320px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.tab{flex:1;padding:9px 0;font-size:12px;font-weight:500;text-align:center;cursor:pointer;color:var(--t3);background:none;border:none;border-bottom:2px solid transparent;transition:all .15s;font-family:'Noto Sans KR',sans-serif}
.tab.active{color:var(--acc);border-bottom-color:var(--acc)}
.tc{display:none;flex:1;overflow:hidden;flex-direction:column}
.tc.active{display:flex}

/* chat */
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.msgs::-webkit-scrollbar{width:3px}
.msgs::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.bbl{padding:8px 11px;border-radius:10px;font-size:12.5px;line-height:1.55}
.bbl.user{background:var(--bg3);border:1px solid var(--border);color:var(--t1)}
.bbl.ai{background:rgba(127,119,221,.07);border:1px solid rgba(127,119,221,.2);color:var(--t1)}
.bbl.sys{background:var(--bg3);color:var(--t2);font-size:12px;text-align:center;border:1px solid var(--border)}
.typing-row{padding:4px 12px;display:none;align-items:center;gap:4px;flex-shrink:0}
.typing-row.on{display:flex}
.td{width:5px;height:5px;border-radius:50%;background:var(--acc);animation:bop 1.1s infinite}
.td:nth-child(2){animation-delay:.18s}.td:nth-child(3){animation-delay:.36s}
@keyframes bop{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}
.chat-foot{padding:10px;border-top:1px solid var(--border);flex-shrink:0}
.inpw{position:relative;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;transition:border-color .15s,box-shadow .15s}
.inpw:focus-within{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-glow)}
textarea{width:100%;background:transparent;border:none;outline:none;color:var(--t1);font-family:'Noto Sans KR',sans-serif;font-size:12.5px;padding:8px 38px 8px 10px;resize:none;min-height:58px;max-height:100px;line-height:1.5}
textarea::placeholder{color:var(--t3)}
.sbtn{position:absolute;bottom:7px;right:7px;width:26px;height:26px;border-radius:6px;background:var(--acc);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;transition:background .15s}
.sbtn:hover{background:var(--acc2)}
.sbtn:disabled{background:var(--bg3);color:var(--t3);cursor:default}
.sbtn svg{width:12px;height:12px}
.qps{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.qp{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:3px 8px;font-size:11px;color:var(--t2);cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .15s}
.qp:hover{border-color:var(--acc);color:var(--acc)}

/* manual */
.manual{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.manual::-webkit-scrollbar{width:3px}
.manual::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.sec{font-size:10px;font-weight:500;color:var(--t3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.fld label{font-size:11px;color:var(--t2)}
.fld input,.fld select{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:7px 10px;font-size:12.5px;color:var(--t1);font-family:'Noto Sans KR',sans-serif;outline:none;width:100%;transition:border-color .15s}
.fld input:focus,.fld select:focus{border-color:var(--acc)}
.fld select option{background:var(--bg2)}
.btn{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:8px 0;font-size:12.5px;font-weight:500;cursor:pointer;color:var(--t1);font-family:'Noto Sans KR',sans-serif;transition:all .15s;margin-bottom:4px}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.prim{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.prim:hover{background:var(--acc2);border-color:var(--acc2)}
.btn.danger{border-color:rgba(248,113,113,.4);color:#f87171}
.btn.danger:hover{background:rgba(248,113,113,.08)}
.nlist{display:flex;flex-direction:column;gap:3px;max-height:160px;overflow-y:auto}
.nlist::-webkit-scrollbar{width:3px}
.nlist::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.nitem{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:7px;border:1px solid var(--border);font-size:12px;cursor:pointer;transition:border-color .15s}
.nitem:hover{border-color:var(--border2)}
.ndot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.nname{flex:1;color:var(--t1)}
.nbadge{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em}
.ndel{background:none;border:none;color:var(--t3);cursor:pointer;font-size:13px;padding:0 2px;line-height:1}
.ndel:hover{color:#f87171}

/* right graph */
.right{flex:1;position:relative;overflow:hidden;background:var(--bg)}
.gbg{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(127,119,221,.07) 1px,transparent 1px);background-size:28px 28px}
#gc{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.ei{width:56px;height:56px;border-radius:50%;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:24px;animation:fl 4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.et{font-size:15px;font-weight:500;color:var(--t2)}
.ed{font-size:12px;color:var(--t3);text-align:center;max-width:220px;line-height:1.6}
.legend{position:absolute;bottom:16px;right:16px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;display:none;flex-direction:column;gap:6px}
.legend.on{display:flex}
.legt{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.legi{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--t2)}
.legdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.zctrl{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:3px}
.zbtn{width:28px;height:28px;background:var(--bg2);border:1px solid var(--border);border-radius:7px;color:var(--t2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:monospace}
.zbtn:hover{border-color:var(--acc);color:var(--acc)}
.tip{position:absolute;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:9px 12px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .12s;max-width:180px;line-height:1.5;z-index:9}
.tip.on{opacity:1}
.tipn{font-size:13px;font-weight:500;color:var(--t1);margin-bottom:2px}
.tipt{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);margin-bottom:4px}
.tipd{color:var(--t2)}
.sbar{position:absolute;top:14px;left:14px;display:flex;gap:5px}
.spill{display:flex;align-items:center;gap:4px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:3px 9px;font-size:11px;color:var(--t2)}
.spdot{width:5px;height:5px;border-radius:50%}
@media(max-width:600px){.left{width:100%;height:45vh;flex-shrink:0;border-right:none;border-bottom:1px solid var(--border)}.main{flex-direction:column}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo">RELATION<span>.MAP</span></div>
    <div class="chips">
      <div class="chip"><div class="cdot" style="background:var(--c-me)"></div><span id="nc">노드 0</span></div>
      <div class="chip"><div class="cdot" style="background:rgba(127,119,221,.5)"></div><span id="ec">연결 0</span></div>
    </div>
  </div>
  <div class="main">
    <div class="left">
      <div class="tabs">
        <button class="tab active" onclick="sw('ai',this)">AI 분석</button>
        <button class="tab" onclick="sw('manual',this)">직접 입력</button>
      </div>

      <div class="tc active" id="tc-ai">
        <div class="msgs" id="msgs">
          <div class="bbl sys">안녕하세요! 나와 상대방을 소개해주세요.<br><br>예: <em>"나는 김지수야. 이민준은 내 대학 동기야."</em></div>
        </div>
        <div class="typing-row" id="typing"><div class="td"></div><div class="td"></div><div class="td"></div><span style="font-size:11px;color:var(--t3);margin-left:5px">AI 분석 중...</span></div>
        <div class="chat-foot">
          <div class="inpw">
            <textarea id="ainput" placeholder="예: 박서연은 내 직장 상사야. 친절하고 능력 있어." rows="2"></textarea>
            <button class="sbtn" id="sbtn" onclick="sendAI()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
          <div class="qps">
            <button class="qp" onclick="qi('내 소개할게')">내 소개</button>
            <button class="qp" onclick="qi('새 사람을 추가할게')">사람 추가</button>
            <button class="qp" onclick="qi('두 사람 관계 설명')">관계 설명</button>
            <button class="qp" onclick="qi('전체 초기화')">초기화</button>
          </div>
        </div>
      </div>

      <div class="tc" id="tc-manual">
        <div class="manual">
          <div>
            <div class="sec">노드 추가</div>
            <div class="fld"><label>이름</label><input id="m-name" placeholder="예: 김민정" /></div>
            <div class="fld"><label>유형</label>
              <select id="m-type">
                <option value="me">나 (본인)</option>
                <option value="person" selected>사람</option>
                <option value="info">속성 / 특징</option>
              </select>
            </div>
            <div class="fld"><label>설명 (선택)</label><input id="m-desc" placeholder="예: 대학 동기, 스타트업 창업" /></div>
            <button class="btn prim" onclick="mAddNode()">+ 노드 추가</button>
          </div>
          <div>
            <div class="sec">연결 추가</div>
            <div class="fld"><label>출발 노드</label><select id="m-src"><option value="">선택...</option></select></div>
            <div class="fld"><label>도착 노드</label><select id="m-tgt"><option value="">선택...</option></select></div>
            <div class="fld"><label>관계 레이블 (선택)</label><input id="m-elabel" placeholder="예: 직장 동료" /></div>
            <button class="btn prim" onclick="mAddEdge()">→ 연결 추가</button>
          </div>
          <div>
            <div class="sec">노드 목록</div>
            <div class="nlist" id="nlist"><div style="font-size:12px;color:var(--t3);text-align:center;padding:8px">노드가 없습니다</div></div>
          </div>
          <button class="btn danger" onclick="clearAll()">전체 초기화</button>
        </div>
      </div>
    </div>

    <div class="right">
      <div class="gbg"></div>
      <div class="empty" id="empty">
        <div class="ei">🕸</div>
        <div class="et">관계도가 여기에 표시됩니다</div>
        <div class="ed">왼쪽에서 AI 분석 또는 직접 입력으로 관계를 추가하세요</div>
      </div>
      <canvas id="gc"></canvas>
      <div class="sbar">
        <div class="spill"><div class="spdot" style="background:var(--c-me)"></div><span id="nc2">노드 0</span></div>
        <div class="spill"><div class="spdot" style="background:rgba(127,119,221,.5)"></div><span id="ec2">연결 0</span></div>
      </div>
      <div class="zctrl">
        <button class="zbtn" onclick="zi()">+</button>
        <button class="zbtn" onclick="zo()">−</button>
        <button class="zbtn" onclick="zr()">⊙</button>
      </div>
      <div class="legend" id="legend">
        <div class="legt">범례</div>
        <div class="legi"><div class="legdot" style="background:var(--c-me)"></div>나</div>
        <div class="legi"><div class="legdot" style="background:var(--c-person)"></div>사람</div>
        <div class="legi"><div class="legdot" style="background:var(--c-info)"></div>속성/특징</div>
      </div>
      <div class="tip" id="tip">
        <div class="tipn" id="tn"></div>
        <div class="tipt" id="tt"></div>
        <div class="tipd" id="td"></div>
      </div>
    </div>
  </div>
</div>

<script>
const canvas=document.getElementById('gc');
const ctx=canvas.getContext('2d');
let nodes=[],edges=[],history=[],hovered=null,dragging=null,dox=0,doy=0,panning=false,panStart={x:0,y:0,tx:0,ty:0};
let tf={x:0,y:0,s:1};

const API_KEY = 'YOUR_API_KEY_HERE';

function resz(){const p=canvas.parentElement;canvas.width=p.clientWidth;canvas.height=p.clientHeight}
resz();window.addEventListener('resize',resz);

function nc_color(t){return t==='me'?'#7F77DD':t==='person'?'#1D9E75':'#BA7517'}
function nr(t){return t==='me'?22:t==='person'?17:11}
function nl(s){return s.length>9?s.slice(0,8)+'…':s}

function forces(){
  const rep=3800,att=0.038,damp=0.83,cx=canvas.width/2,cy=canvas.height/2;
  nodes.forEach(n=>{if(!n.vx)n.vx=0;if(!n.vy)n.vy=0;n.vx+=(cx-n.x)*.0018;n.vy+=(cy-n.y)*.0018});
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
    const dx=nodes[j].x-nodes[i].x,dy=nodes[j].y-nodes[i].y,d=Math.hypot(dx,dy)||1,f=rep/(d*d);
    nodes[i].vx-=(dx/d)*f;nodes[i].vy-=(dy/d)*f;nodes[j].vx+=(dx/d)*f;nodes[j].vy+=(dy/d)*f;
  }
  edges.forEach(e=>{
    const s=nodes.find(n=>n.id===e.s),t=nodes.find(n=>n.id===e.t);
    if(!s||!t)return;
    const dx=t.x-s.x,dy=t.y-s.y,d=Math.hypot(dx,dy)||1,f=d*att;
    s.vx+=(dx/d)*f;s.vy+=(dy/d)*f;t.vx-=(dx/d)*f;t.vy-=(dy/d)*f;
  });
  nodes.forEach(n=>{if(n.pin)return;n.vx*=damp;n.vy*=damp;n.x+=n.vx;n.y+=n.vy});
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!nodes.length){requestAnimationFrame(draw);return}
  ctx.save();ctx.translate(tf.x,tf.y);ctx.scale(tf.s,tf.s);
  edges.forEach(e=>{
    const s=nodes.find(n=>n.id===e.s),t=nodes.find(n=>n.id===e.t);if(!s||!t)return;
    const hi=hovered&&(hovered.id===e.s||hovered.id===e.t);
    ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(t.x,t.y);
    ctx.strokeStyle=hi?'rgba(127,119,221,.75)':'rgba(127,119,221,.25)';ctx.lineWidth=hi?1.5:.7;ctx.stroke();
    if(e.l&&hi){
      const mx=(s.x+t.x)/2,my=(s.y+t.y)/2;
      ctx.save();ctx.font='10px "Noto Sans KR"';
      const tw=ctx.measureText(e.l).width;
      ctx.fillStyle='rgba(13,15,20,.9)';ctx.fillRect(mx-tw/2-3,my-16,tw+6,14);
      ctx.fillStyle='rgba(139,144,158,.9)';ctx.textAlign='center';ctx.fillText(e.l,mx,my-5);ctx.restore();
    }
  });
  nodes.forEach(n=>{
    const hi=hovered&&hovered.id===n.id,r=nr(n.type),col=nc_color(n.type);
    const [rv,gv,bv]=[parseInt(col.slice(1,3),16),parseInt(col.slice(3,5),16),parseInt(col.slice(5,7),16)];
    if(hi||n.type==='me'){
      const g=ctx.createRadialGradient(n.x,n.y,r,n.x,n.y,r+14);
      g.addColorStop(0,`rgba(${rv},${gv},${bv},${hi?.3:.12})`);g.addColorStop(1,`rgba(${rv},${gv},${bv},0)`);
      ctx.beginPath();ctx.arc(n.x,n.y,r+14,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    }
    ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);ctx.fillStyle=hi?col:col+'aa';ctx.fill();
    ctx.strokeStyle=hi?'rgba(255,255,255,.6)':col+'66';ctx.lineWidth=hi?1.5:.8;ctx.stroke();
    ctx.font=`${n.type==='me'?'500':'400'} 11px "Noto Sans KR"`;
    ctx.fillStyle=hi?'#e8eaf0':'#8b909e';ctx.textAlign='center';ctx.fillText(nl(n.label),n.x,n.y+r+13);
  });
  ctx.restore();forces();requestAnimationFrame(draw);
}
draw();

function toG(cx,cy){const r=canvas.getBoundingClientRect();return{x:(cx-r.left-tf.x)/tf.s,y:(cy-r.top-tf.y)/tf.s}}
function hit(p){return nodes.slice().reverse().find(n=>Math.hypot(n.x-p.x,n.y-p.y)<=nr(n.type)+6)}

canvas.addEventListener('mousedown',e=>{
  const p=toG(e.clientX,e.clientY),h=hit(p);
  if(h){dragging=h;dox=h.x-p.x;doy=h.y-p.y}
  else{panning=true;panStart={x:e.clientX,y:e.clientY,tx:tf.x,ty:tf.y}}
});
canvas.addEventListener('mousemove',e=>{
  if(dragging){const p=toG(e.clientX,e.clientY);dragging.x=p.x+dox;dragging.y=p.y+doy;dragging.pin=true;canvas.style.cursor='grabbing';return}
  if(panning){tf.x=panStart.tx+(e.clientX-panStart.x);tf.y=panStart.ty+(e.clientY-panStart.y);canvas.style.cursor='grabbing';return}
  const p=toG(e.clientX,e.clientY),h=hit(p);hovered=h||null;canvas.style.cursor=h?'pointer':'grab';
  const tip=document.getElementById('tip');
  if(h){tip.classList.add('on');document.getElementById('tn').textContent=h.label;document.getElementById('tt').textContent=h.type==='me'?'나':h.type==='person'?'사람':'속성/특징';document.getElementById('td').textContent=h.desc||'';const r=canvas.getBoundingClientRect();tip.style.left=(e.clientX-r.left+12)+'px';tip.style.top=(e.clientY-r.top-10)+'px'}
  else tip.classList.remove('on');
});
canvas.addEventListener('mouseup',()=>{dragging=null;panning=false;canvas.style.cursor='grab'});
canvas.addEventListener('mouseleave',()=>{dragging=null;panning=false;hovered=null;document.getElementById('tip').classList.remove('on')});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();const r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  const f=e.deltaY>0?.87:1.15,ns=Math.max(.2,Math.min(4,tf.s*f));
  tf.x=mx-(mx-tf.x)*(ns/tf.s);tf.y=my-(my-tf.y)*(ns/tf.s);tf.s=ns;
},{passive:false});

let ltd=0;
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===1){const t=e.touches[0],p=toG(t.clientX,t.clientY),h=hit(p);if(h){dragging=h;dox=h.x-p.x;doy=h.y-p.y}else{panning=true;panStart={x:t.clientX,y:t.clientY,tx:tf.x,ty:tf.y}}}
  else if(e.touches.length===2)ltd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1){const t=e.touches[0];if(dragging){const p=toG(t.clientX,t.clientY);dragging.x=p.x+dox;dragging.y=p.y+doy;dragging.pin=true}else if(panning){tf.x=panStart.tx+(t.clientX-panStart.x);tf.y=panStart.ty+(t.clientY-panStart.y)}}
  else if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);tf.s=Math.max(.2,Math.min(4,tf.s*(d/ltd)));ltd=d}
},{passive:false});
canvas.addEventListener('touchend',()=>{dragging=null;panning=false});

function addNode(id,label,type,desc){
  if(nodes.find(n=>n.id===id))return;
  const cx=canvas.width/2,cy=canvas.height/2;
  nodes.push({id,label,type:type||'person',desc:desc||'',x:cx+(Math.random()-.5)*220,y:cy+(Math.random()-.5)*180,vx:0,vy:0,pin:false});
  upd();
}
function addEdge(s,t,l){
  if(!edges.find(e=>(e.s===s&&e.t===t)||(e.s===t&&e.t===s)))edges.push({s,t,l:l||''});
  upd();
}
function clearAll(){nodes=[];edges=[];history=[];upd()}
function upd(){
  const n=nodes.length,e=edges.length;
  document.getElementById('nc').textContent=`노드 ${n}`;document.getElementById('ec').textContent=`연결 ${e}`;
  document.getElementById('nc2').textContent=`노드 ${n}`;document.getElementById('ec2').textContent=`연결 ${e}`;
  document.getElementById('empty').style.display=n?'none':'flex';
  document.getElementById('legend').classList.toggle('on',n>0);
  updSels();updList();
}

function zi(){tf.s=Math.min(4,tf.s*1.25)}
function zo(){tf.s=Math.max(.2,tf.s*.8)}
function zr(){tf={x:0,y:0,s:1};nodes.forEach(n=>n.pin=false)}
function sw(id,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tc').forEach(t=>t.classList.remove('active'));el.classList.add('active');document.getElementById('tc-'+id).classList.add('active')}

function addMsg(role,html){
  const m=document.getElementById('msgs'),d=document.createElement('div');
  d.className='bbl '+role;d.innerHTML=html;m.appendChild(d);m.scrollTop=m.scrollHeight;
}
function qi(t){document.getElementById('ainput').value=t;document.getElementById('ainput').focus()}

async function sendAI(){
  const inp=document.getElementById('ainput'),text=inp.value.trim();if(!text)return;
  inp.value='';addMsg('user',text.replace(/</g,'&lt;'));
  document.getElementById('typing').classList.add('on');document.getElementById('sbtn').disabled=true;

  const sys=`사용자 대화에서 인물/관계를 추출해 JSON만 출력하세요. 다른 텍스트 없음.
현재 노드:${JSON.stringify(nodes.map(n=>({id:n.id,label:n.label,type:n.type})))}
현재 연결:${JSON.stringify(edges.map(e=>({s:e.s,t:e.t,l:e.l})))}
형식:{"msg":"한국어 응답","actions":[{"op":"node","id":"영문ID","label":"이름","type":"me|person|info","desc":"설명"},{"op":"edge","s":"ID","t":"ID","l":"관계"},{"op":"clear"}]}
규칙:자기자신=me/id:me, 사람=person, 속성=info. 기존노드 재추가금지. JSON만출력.`;

  history.push({role:'user',content:text});
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':API_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,system:sys,messages:history})
    });
    if(!resp.ok){const e=await resp.json();throw new Error(e.error?.message||'API 오류')}
    const data=await resp.json(),raw=data.content?.[0]?.text||'{}';
    history.push({role:'assistant',content:raw});
    let p;try{p=JSON.parse(raw.replace(/```json|```/g,'').trim())}catch{p={msg:'분석 결과 처리 오류',actions:[]}}
    (p.actions||[]).forEach(a=>{if(a.op==='node')addNode(a.id,a.label,a.type,a.desc);else if(a.op==='edge')addEdge(a.s,a.t,a.l);else if(a.op==='clear')clearAll()});
    addMsg('ai',p.msg||'업데이트 완료');
  }catch(err){addMsg('ai',`오류: ${err.message}`)}
  document.getElementById('typing').classList.remove('on');document.getElementById('sbtn').disabled=false;
}
document.getElementById('ainput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendAI()}});

function mAddNode(){
  const name=document.getElementById('m-name').value.trim();if(!name)return;
  const type=document.getElementById('m-type').value,desc=document.getElementById('m-desc').value.trim();
  const id=type==='me'?'me':'n_'+name.replace(/\s/g,'_')+'_'+Date.now().toString(36).slice(-4);
  if(nodes.find(n=>n.id===id||n.label===name))return;
  addNode(id,name,type,desc);
  document.getElementById('m-name').value='';document.getElementById('m-desc').value='';
}
function mAddEdge(){
  const s=document.getElementById('m-src').value,t=document.getElementById('m-tgt').value;if(!s||!t||s===t)return;
  addEdge(s,t,document.getElementById('m-elabel').value.trim());document.getElementById('m-elabel').value='';
}
function updSels(){
  ['m-src','m-tgt'].forEach(id=>{const sel=document.getElementById(id),cur=sel.value;sel.innerHTML='<option value="">선택...</option>';nodes.forEach(n=>{const o=document.createElement('option');o.value=n.id;o.textContent=n.label;sel.appendChild(o)});sel.value=cur});
}
function updList(){
  const el=document.getElementById('nlist');
  if(!nodes.length){el.innerHTML='<div style="font-size:12px;color:var(--t3);text-align:center;padding:8px">노드가 없습니다</div>';return}
  el.innerHTML=nodes.map(n=>`<div class="nitem" onclick="focusNode('${n.id}')"><div class="ndot" style="background:${nc_color(n.type)}"></div><span class="nname">${n.label}</span><span class="nbadge">${n.type==='me'?'나':n.type==='person'?'사람':'속성'}</span><button class="ndel" onclick="event.stopPropagation();delNode('${n.id}')">×</button></div>`).join('');
}
function focusNode(id){const n=nodes.find(x=>x.id===id);if(!n)return;tf.x=canvas.width/2-n.x*tf.s;tf.y=canvas.height/2-n.y*tf.s}
function delNode(id){nodes=nodes.filter(n=>n.id!==id);edges=edges.filter(e=>e.s!==id&&e.t!==id);upd()}
</script>
</body>
</html>
